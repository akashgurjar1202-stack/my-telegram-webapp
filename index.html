<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colorful Reward Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-bottom: 20px;
      color: #ffffff;
    }

    .btn {
      width: 90%;
      max-width: 320px;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Pink Buttons */
    .btn-pink {
      background-color: #ff4081;
      color: #ffffff;
    }

    /* Green Claim Button */
    .btn-green {
      background-color: #00e676;
      color: #000000;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <h2>🎁 Daily Rewards</h2>

  <button class="btn btn-pink">👤 Profile</button>
  <button class="btn btn-pink">📋 Tasks</button>
  
  <!-- Main Green Claim Button -->
  <button class="btn btn-green" onclick="claimReward()">🎁 CLAIM NOW</button>

  <button class="btn btn-pink">👥 Invite Friends</button>
  <button class="btn btn-pink">⚙️ Settings</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function claimReward() {
      // Telegram bot ko message/data bhejna
      tg.sendData(JSON.stringify({ action: "claim_reward" }));
      tg.close();
    }
  </script>
</body>
</html>
